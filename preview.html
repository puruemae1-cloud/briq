<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Briq · 실시간 조회 미리보기</title>
  <style>
    :root {
      --ink: #0b1210;
      --ink-soft: #1a2420;
      --mist: #ececeb;
      --paper: #ffffff;
      --line: rgba(11, 18, 16, 0.12);
      --accent: #1f4d3a;
      --accent-bright: #2f6b50;
      --gold: #b7a16a;
      --frame: #e7e7e7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    .note {
      font-size: 13px;
      letter-spacing: 0.02em;
      color: rgba(11, 18, 16, 0.55);
      margin: 0 0 22px;
      max-width: 42rem;
      line-height: 1.55;
    }
    .note strong { color: var(--ink-soft); font-weight: 600; }
    .pdp {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 40px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .pdp { grid-template-columns: 1fr; gap: 28px; }
    }
    .gallery {
      position: relative;
      background: var(--frame);
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 8%;
    }
    /* Live viewers chip on the product thumbnail */
    .viewers {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12.5px;
      letter-spacing: -0.01em;
      line-height: 1.2;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2;
    }
    .viewers__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 0 0 rgba(47, 107, 80, 0.55);
      animation: pulse 1.8s ease-out infinite;
      flex: 0 0 auto;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(47, 107, 80, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(47, 107, 80, 0); }
      100% { box-shadow: 0 0 0 0 rgba(47, 107, 80, 0); }
    }
    .viewers__text { white-space: nowrap; }
    .viewers__n {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      color: var(--accent);
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .thumbs button {
      appearance: none;
      border: 1px solid transparent;
      background: var(--frame);
      padding: 0;
      aspect-ratio: 1;
      cursor: pointer;
      overflow: hidden;
    }
    .thumbs button.is-active { border-color: var(--ink); }
    .thumbs img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10%;
      display: block;
    }
    .info .brand {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(11, 18, 16, 0.55);
    }
    .info h1 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(1.45rem, 2.4vw, 1.85rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .info .price {
      margin: 0 0 18px;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }
    .info .desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      color: rgba(11, 18, 16, 0.78);
      max-width: 34rem;
    }
    .alt {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .alt h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(11, 18, 16, 0.55);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 720px) {
      .cards { grid-template-columns: 1fr 1fr; }
    }
    .card {
      position: relative;
      background: var(--frame);
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10%;
      display: block;
    }
    .card .viewers {
      left: 8px;
      bottom: 8px;
      padding: 6px 9px;
      font-size: 11px;
      gap: 6px;
    }
    .card .viewers__dot { width: 6px; height: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="note">
      <strong>미리보기</strong> — 상품 메인 썸네일(갤러리) 위에
      “지금 N명이 이 제품을 보고 있어요”를 올린 예시입니다.
      실제 서비스에서는 PDP 진입 시 presence heartbeat로 집계합니다.
    </p>

    <div class="pdp">
      <div>
        <div class="gallery" id="gallery">
          <img id="hero" alt="케니 스카이브 러너 트레이너" src="media/1.jpg" />
          <div class="viewers" aria-live="polite">
            <span class="viewers__dot" aria-hidden="true"></span>
            <span class="viewers__text">
              지금 <span class="viewers__n" id="count">7</span>명이 이 제품을 보고 있어요
            </span>
          </div>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <div class="info">
        <p class="brand">AllSaints</p>
        <h1>케니 스카이브 러너 트레이너</h1>
        <p class="price">361,000원</p>
        <p class="desc">
          가벼운 발레 스타일 트레이너. 빈티지한 느낌을 위해 스티치 라인 디테일과
          스키브 처리된 패턴 가장자리를 특징으로 합니다.
        </p>
      </div>
    </div>

    <div class="alt">
      <h2>Shop grid thumbnail variant</h2>
      <div class="cards">
        <div class="card">
          <img alt="" src="media/1.jpg" />
          <div class="viewers">
            <span class="viewers__dot" aria-hidden="true"></span>
            <span class="viewers__text"><span class="viewers__n" data-count>7</span>명 보는 중</span>
          </div>
        </div>
        <div class="card">
          <img alt="" src="media/2.jpg" />
          <div class="viewers">
            <span class="viewers__dot" aria-hidden="true"></span>
            <span class="viewers__text"><span class="viewers__n" data-count>4</span>명 보는 중</span>
          </div>
        </div>
        <div class="card">
          <img alt="" src="media/3.jpg" />
          <div class="viewers">
            <span class="viewers__dot" aria-hidden="true"></span>
            <span class="viewers__text"><span class="viewers__n" data-count>12</span>명 보는 중</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const imgs = [1, 2, 3, 4, 5].map((n) => `media/${n}.jpg`);
    const hero = document.getElementById("hero");
    const thumbs = document.getElementById("thumbs");
    imgs.forEach((src, i) => {
      const b = document.createElement("button");
      b.type = "button";
      if (i === 0) b.classList.add("is-active");
      b.innerHTML = `<img src="${src}" alt="" />`;
      b.addEventListener("click", () => {
        hero.src = src;
        thumbs.querySelectorAll("button").forEach((el) => el.classList.remove("is-active"));
        b.classList.add("is-active");
      });
      thumbs.appendChild(b);
    });

    // Soft live feel — count drifts slowly within a believable band.
    let n = 7;
    const main = document.getElementById("count");
    const cards = [...document.querySelectorAll("[data-count]")];
    function tick() {
      const delta = Math.random() < 0.55 ? 1 : -1;
      n = Math.min(18, Math.max(3, n + delta));
      main.textContent = String(n);
      cards.forEach((el, i) => {
        const base = [n, Math.max(2, n - 3), Math.min(20, n + 5)][i];
        el.textContent = String(base);
      });
    }
    setInterval(tick, 2800);
  </script>
</body>
</html>
