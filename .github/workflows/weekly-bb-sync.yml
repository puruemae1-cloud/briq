name: Weekly BB stock sync

on:
  schedule:
    # Every Monday 10:00 UTC (~19:00 KST) — after CW/GG
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-bb-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Burberry catalogue (stock + new + restock)
        env:
          BB_REFRESH_STOCK: "1"
        run: python3 scripts/weekly-bb-stock-sync.py

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Burberry stock + catalogue sync" \
            src/data/bb
