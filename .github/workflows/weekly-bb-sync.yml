name: Weekly BB stock sync

on:
  schedule:
    # Every Monday 10:00 UTC (~19:00 KST) — after CW/GG
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-bb-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Burberry catalogue (stock + new + restock)
        env:
          BB_REFRESH_STOCK: "1"
        run: python3 scripts/weekly-bb-stock-sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "briq-bot"
          git config user.email "briq-bot@users.noreply.github.com"
          git add -A src/data/bb public/products/bb-pdp
          if git diff --staged --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: weekly Burberry stock + catalogue sync

          Auto-refresh sold-out / restocked options, new styles, prices, and PLP membership from uk.burberry.com (women/men/children/gifts/scarves/bags/beauty).
          EOF
          )"
          git push
