name: Homepage speed guard

# Self-healing homepage guard for Korean customers (see
# .cursor/rules/homepage-speed.mdc):
# - After every Production deploy: fill the homepage cache before customers do
#   (the first hit after a deploy builds the product cards, ~15s).
# - Every 10 min: keep instances warm for ~9 min (3 rounds, cron is best-effort).
# - Slow / broken / no product rails: burst requests to spin up instances and
#   refill the cache, re-check. Only a failure that survives healing fails the
#   run (GitHub email = last resort).

on:
  schedule:
    - cron: "*/10 * * * *"
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-speed-guard-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  guard:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://www.briq.kr
      LIMIT: "8"
      ROUNDS: ${{ github.event_name == 'schedule' && '3' || '1' }}
    steps:
      - name: Fill cache after deploy
        if: github.event_name == 'deployment_status'
        run: |
          # First request after a deploy builds + caches the cards; take that
          # hit here (and spin up a few instances) instead of a customer.
          for i in 1 2 3; do
            curl -s -o /dev/null -m 90 -w "fill$i status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n" "$SITE/" || true
          done

      - name: Warm shop menus after deploy
        if: github.event_name == 'deployment_status'
        run: |
          # /shop HTML is edge-cached per region, so this mainly loads the
          # catalogues into the icn1 functions before the first Korean visitor.
          curl -s -m 90 "$SITE/" -o /tmp/menu.html || true
          { echo "/shop"; grep -o 'href="/shop?[^"]*' /tmp/menu.html | sed 's/^href="//; s/&amp;/\&/g'; } \
            | sort -u > /tmp/menus.txt
          echo "warming $(wc -l < /tmp/menus.txt) shop pages"
          xargs -P 6 -I{} curl -s -o /dev/null -m 90 \
            -w "%{http_code} %{time_starttransfer}s {}\n" \
            -H "User-Agent: briq-speed-guard" "$SITE{}" < /tmp/menus.txt || true

      - name: Shop and product pages
        run: |
          # The homepage can still answer while catalogue-heavy routes crash
          # (OOM-killed functions return 500 on /shop and every product page).
          set -u
          get() {
            local code
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/page.html -m 60 -w "%{http_code}" \
                -H "User-Agent: briq-speed-guard" "$SITE$1" || echo 000)
              echo "  $1 try$i status=$code"
              [ "$code" = "200" ] && return 0
              sleep 10
            done
            echo "::error::$1 returned $code after 3 tries"
            return 1
          }
          failed=0
          get "/api/products/shop?category=all" || failed=1
          get "/shop" || failed=1
          products=$(grep -o 'href="/product/[^"?]*' /tmp/page.html | sed 's/^href="//' | sort -u | head -3)
          if [ -z "$products" ]; then
            echo "::error::no product links on /shop"
            failed=1
          fi
          for p in $products; do get "$p" || failed=1; done
          exit $failed

      - name: Hero headline word spacing
        if: github.event_name != 'schedule'
        run: |
          # Desktop shows "London to Your Door" on one line; a missing space
          # between "to" and "Your" renders as "toYour".
          curl -sL -m 90 -H "User-Agent: briq-speed-guard" "$SITE/" -o /tmp/hero.html
          python3 - <<'PY'
          import re, sys
          html = open("/tmp/hero.html", encoding="utf-8").read()
          m = re.search(r'<h1 class="hero__brand">(.*?)</h1>', html, re.S)
          if not m:
              sys.exit("::error::hero__brand headline not found on homepage")
          text = re.sub(r"<[^>]+>", "", m.group(1)).replace("&nbsp;", " ").replace("\u00a0", " ")
          print("headline:", repr(text))
          if not re.fullmatch(r"\s*London to Your Door\s*", text):
              sys.exit("::error::Homepage headline spacing broken (expected 'London to Your Door')")
          PY

      - name: Warm, check, self-heal
        run: |
          set -u

          # 0 = healthy. Healthy = HTTP 200, TTFB <= LIMIT, product rails rendered.
          check() {
            local bad=0 out code ttfb
            for i in 1 2 3; do
              out=$(curl -sL -m 60 -o /tmp/home.html \
                -w "%{http_code} %{time_starttransfer}" \
                -H "User-Agent: briq-speed-guard" "$SITE/" || echo "000 60")
              code=${out%% *}; ttfb=${out##* }
              rails=$(grep -o "product-grid--lookbook" /tmp/home.html 2>/dev/null | wc -l | tr -d ' ')
              echo "  try$i status=$code ttfb=${ttfb}s rails=$rails"
              if [ "$code" != "200" ] || [ "$rails" = "0" ] \
                || awk "BEGIN{exit !($ttfb > $LIMIT)}"; then
                bad=$((bad+1))
              fi
              sleep 2
            done
            # One slow cold hit per round is tolerated.
            [ "$bad" -lt 2 ]
          }

          heal() {
            echo "  healing: parallel burst to spin up instances + refill cache"
            for i in 1 2 3 4 5 6; do
              curl -s -o /dev/null -m 90 "$SITE/?heal=$(date +%s)$i" &
            done
            wait
            sleep 20
          }

          failed=0
          for round in $(seq 1 "$ROUNDS"); do
            echo "round $round"
            if ! check; then
              heal
              if check; then
                echo "  recovered after heal"
              else
                heal
                if check; then
                  echo "  recovered after second heal"
                else
                  echo "::error::Homepage still slow/broken after 2 heal attempts (round $round)"
                  failed=1
                fi
              fi
            fi
            [ "$round" -lt "$ROUNDS" ] && sleep 170
          done
          exit $failed
