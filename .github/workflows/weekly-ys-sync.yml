name: Biweekly Saint Laurent sync

on:
  schedule:
    # Odd ISO weeks only (gate job) — even weeks exit before any catalogue commit.
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ys-stock-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Odd ISO week only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — syncing."
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — syncing."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — skip (biweekly). No catalogue push."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install curl_cffi
          pip install -r scripts/requirements-images.txt || true
      - name: Restore ys-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs ys-pdp
      - name: Run Saint Laurent weekly sync
        run: |
          chmod +x scripts/run-ys-weekly-sync.sh scripts/ci-publish-pdp-cdn.sh
          scripts/run-ys-weekly-sync.sh
      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand ys
      - name: Commit catalog updates
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore(ys): weekly catalog sync" \
            src/data/ys \
            src/data/product-images-manifest.json \
            scripts/run-ys-weekly-sync.sh \
            scripts/patch-ys-size-charts-and-copy.py \
            scripts/ys_size_charts.py \
            scripts/build-ys-catalog.py \
            scripts/repair-ys-missing-images.py \
            scripts/ci-publish-pdp-cdn.sh \
            scripts/push-missing-pdp-chunked.py \
            scripts/list-missing-pdp-on-cdn.py \
            scripts/verify-product-images.py
