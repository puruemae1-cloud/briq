name: Weekly London Undercover stock sync

on:
  schedule:
    # Every Monday 14:00 UTC (~23:00 KST) — after Paul Smith
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-lu-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync London Undercover catalogue (stock + new + remove)
        run: python3 scripts/weekly-lu-stock-sync.py

      - name: Push new PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs lu-pdp

      - name: Commit and push if changed
        run: |
          git config user.name "briq-bot"
          git config user.email "briq-bot@users.noreply.github.com"
          git add -A src/data/lu scripts/scrape-lu.py scripts/weekly-lu-stock-sync.py scripts/build-lu-catalog.py scripts/build-lu-lifestyle-catalog.py scripts/push-product-images-tag.py
          if git diff --staged --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: weekly London Undercover stock + catalogue sync

          Refresh sold-out / restocked options, add new styles, and drop discontinued products from londonundercover.co.uk.
          EOF
          )"
          git push
