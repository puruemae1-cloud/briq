name: Weekly London Undercover stock sync

on:
  schedule:
    # Every Friday 09:00 UTC (10:00 UK / BST) — after Paul Smith
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-lu-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Restore lu-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs lu-pdp

      - name: Sync London Undercover catalogue (stock + new + remove)
        run: python3 scripts/weekly-lu-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs lu-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand lu --remote --skip-local --all-images

      - name: Commit and push catalogue
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly London Undercover stock + catalogue sync" \
            src/data/lu \
            scripts/scrape-lu.py \
            scripts/weekly-lu-stock-sync.py \
            scripts/build-lu-catalog.py \
            scripts/build-lu-lifestyle-catalog.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
