name: Weekly Mulberry sync

on:
  schedule:
    - cron: "30 14 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install chromium
      - name: Run Mulberry weekly sync
        run: |
          chmod +x scripts/run-mb-weekly-sync.sh
          scripts/run-mb-weekly-sync.sh
      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mb public/products/mb-pdp src/data/product-images-manifest.json || true
          if git diff --staged --quiet; then
            echo "No MB catalog changes"
          else
            git commit -m "chore(mb): weekly catalog sync"
            git push
          fi
