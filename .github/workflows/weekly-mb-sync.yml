name: Weekly Mulberry sync

on:
  schedule:
    - cron: "30 14 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install chromium
      - name: Run Mulberry weekly sync
        run: |
          chmod +x scripts/run-mb-weekly-sync.sh
          scripts/run-mb-weekly-sync.sh

      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand mb
      - name: Commit catalog updates
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore(mb): weekly catalog sync" \
            src/data/mb \
            src/data/product-images-manifest.json \
            src/data/homepage-rail-picks.json \
            scripts/run-mb-weekly-sync.sh \
            scripts/build-mb-catalog.py \
            scripts/refresh-homepage-rail-picks.py \
            scripts/list-missing-pdp-on-cdn.py \
            scripts/verify-catalog-images.py
