name: Weekly GG stock sync

on:
  schedule:
    # Every Friday 03:00 UTC (04:00 UK / BST)
    - cron: "0 3 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-gg-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Restore gg-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs gg-pdp

      - name: Sync Galvin Green collections + stock
        run: python3 scripts/weekly-gg-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs gg-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand gg --remote --skip-local --all-images

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Galvin Green stock + catalogue sync" \
            src/data/gg \
            scripts/weekly-gg-stock-sync.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
