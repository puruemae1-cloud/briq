name: Weekly Belstaff stock sync

on:
  schedule:
    # Every Monday 12:00 UTC (~21:00 KST) — after Arc'teryx
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-bs-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Restore bs-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs bs-pdp

      - name: Sync Belstaff catalogue (stock + new + remove)
        run: python3 scripts/weekly-bs-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs bs-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand bs --remote --skip-local --all-images

      - name: Commit and push catalogue
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Belstaff stock + catalogue sync" \
            src/data/bs \
            scripts/weekly-bs-stock-sync.py \
            scripts/catalog_image_guard.py \
            scripts/verify-product-images.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/ci-commit-push.sh
