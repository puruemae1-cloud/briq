name: Weekly Belstaff stock sync

on:
  schedule:
    # Every Monday 12:00 UTC (~21:00 KST) — after Arc'teryx
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-bs-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Belstaff catalogue (stock + new + remove)
        run: python3 scripts/weekly-bs-stock-sync.py

      - name: Push new PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs bs-pdp

      - name: Commit and push if changed
        run: |
          git config user.name "briq-bot"
          git config user.email "briq-bot@users.noreply.github.com"
          git add -A src/data/bs scripts/weekly-bs-stock-sync.py scripts/push-product-images-tag.py
          if git diff --staged --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: weekly Belstaff stock + catalogue sync

          Refresh sold-out / restocked options, add new styles, and drop discontinued products from belstaff.com.
          EOF
          )"
          git push
