name: Biweekly Belstaff stock sync

on:
  schedule:
    # Friday 07:00 UTC (08:00 UK / BST) — after Prada. Odd ISO weeks only —
    # even weeks exit before any catalogue commit so Vercel is not rebuilt.
    - cron: "0 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-bs-stock-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Odd ISO week only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — syncing Belstaff."
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — syncing Belstaff."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — skip Belstaff (biweekly). No catalogue push."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Restore bs-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs bs-pdp

      - name: Sync Belstaff catalogue (stock + new + remove)
        run: python3 scripts/weekly-bs-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs bs-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand bs --remote --skip-local --all-images


      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand bs
      - name: Commit and push catalogue
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Belstaff stock + catalogue sync" \
            src/data/bs \
            scripts/weekly-bs-stock-sync.py \
            scripts/catalog_image_guard.py \
            scripts/verify-product-images.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/ci-commit-push.sh
