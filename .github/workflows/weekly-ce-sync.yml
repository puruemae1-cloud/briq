name: Weekly Celine sync

on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install chromium
      - name: Run Celine weekly sync
        run: |
          chmod +x scripts/run-ce-weekly-sync.sh
          scripts/run-ce-weekly-sync.sh

      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand ce
      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ce || true
          if git diff --staged --quiet; then
            echo "No CE catalog changes"
          else
            git commit -m "chore(ce): weekly catalog sync"
            git push
          fi
