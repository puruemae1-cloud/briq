name: Sports banner refresh (manual only)

# Banners are frozen — no schedule. Run by hand only when a banner change is
# explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-banner-refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Odd ISO week only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — syncing."
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — syncing."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — skip (biweekly). No catalogue push."
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image deps
        run: pip install pillow numpy

      - name: Refresh sports banners only
        run: python3 scripts/weekly-banner-refresh.py
        # Default is sports-only. Locked homepage / brand creatives are never rotated.

      - name: Push banners to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs banners --skip-whiten

      - name: Purge jsDelivr banner cache
        run: python3 scripts/purge-jsdelivr-media.py --dirs banners

      - name: Verify banner CDN matches local files
        run: python3 scripts/verify-banner-cdn.py

      - name: Commit sports banner crops + manifest
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly sports banner refresh" \
            public/banners \
            src/data/banner-refresh-manifest.json \
            src/data/homepage-rail-picks.json \
            scripts/weekly-banner-refresh.py \
            scripts/banner_smart_crop.py \
            scripts/refresh-homepage-rail-picks.py \
            scripts/push-product-images-tag.py
