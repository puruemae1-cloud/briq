name: Weekly Bottega Veneta sync

on:
  schedule:
    # Friday 13:30 UTC (14:30 UK / BST) — between Dior (12:00) and AllSaints (14:00)
    - cron: "30 13 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-bv-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r scripts/requirements-bv.txt
          pip install -r scripts/requirements-images.txt || true

      - name: Restore bv-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs bv-pdp

      - name: Run BV weekly sync
        run: |
          chmod +x scripts/run-bv-weekly-sync.sh
          scripts/run-bv-weekly-sync.sh

      # Selective CDN catch-up in small waves — full bv-pdp force-push hangs /
      # disconnects on this giant tag. Keep chunks at 2 SKUs: packs of 4+ often
      # die with pack-objects SIGBUS / hangup on this machine & GHA runners.
      - name: Push PDP images to product-images tag
        run: |
          python3 scripts/push-missing-pdp-chunked.py --dirs bv-pdp --chunk 2 --max-waves 1000

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand bv --remote --skip-local --all-images

      - name: Guard — fail if any local bv-pdp SKU is still missing on the tag
        run: python3 scripts/list-missing-pdp-on-cdn.py --dirs bv-pdp

      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand bv

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Bottega Veneta catalog sync" \
            src/data/bv \
            src/data/product-images-manifest.json \
            scripts/run-bv-weekly-sync.sh \
            scripts/build-bv-catalog.py \
            scripts/scrape-bv-hub.py \
            scripts/bv_common.py \
            scripts/bv_config.py \
            scripts/weekly-bv-stock-sync.py \
            scripts/push-product-images-tag.py \
            scripts/push-missing-pdp-chunked.py \
            scripts/list-missing-pdp-on-cdn.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
