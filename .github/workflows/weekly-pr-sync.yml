name: Weekly Prada stock sync

on:
  schedule:
    # Every Monday 12:00 UTC — after Arc'teryx
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-pr-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scrape + image deps
        run: |
          pip install "curl_cffi>=0.7.0" beautifulsoup4
          pip install -r scripts/requirements-images.txt || true

      - name: Restore pr-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs pr-pdp

      - name: Sync Prada catalogue (stock + new + restock)
        env:
          PR_REFRESH_STOCK: "1"
          PR_SKIP_NO_PRICE_UPDATE: "1"
        run: python3 scripts/weekly-pr-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs pr-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand pr --remote --skip-local --all-images

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Prada stock + catalogue sync" \
            src/data/pr \
            src/data/categories.ts \
            scripts/weekly-pr-stock-sync.py \
            scripts/build-pr-catalog.py \
            scripts/scrape-pr-fine-jewelry.py \
            scripts/pr_fine_jewelry_ko.py \
            scripts/build_pr_fine_jewelry_ko.py \
            scripts/patch-pr-rtw-short-size-charts.py \
            scripts/pr_size_charts.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
