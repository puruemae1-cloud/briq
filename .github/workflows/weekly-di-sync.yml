name: Biweekly Dior sync

on:
  schedule:
    # Friday 12:00 UTC (13:00 UK / BST) — after Chanel
    # Odd ISO weeks only (gate job) — even weeks exit before any catalogue commit.
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      resume:
        description: "1 = continue the current cycle (auto-filled when a run hits its time budget)"
        required: false
        default: "0"
        type: string
      part:
        description: "Continuation number (auto-filled)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-di-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Odd ISO week only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — syncing."
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — syncing."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — skip (biweekly). No catalogue push."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # GitHub-hosted runners stop at 360 minutes regardless of a higher value.
    timeout-minutes: 360
    env:
      # run-di-*.sh default to the macOS cache path when this is unset.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - name: Free runner disk space
        run: |
          # Full-history checkout + restored PDP images overflow the default
          # runner disk; drop preinstalled SDKs the syncs never use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history pulls every branch + old image objects (checkout took up
          # to an hour); syncs only need HEAD and fetch the image tag themselves.
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity for pipeline commits
        run: |
          git config user.name "briq-bot"
          git config user.email "briq-bot@users.noreply.github.com"

      - name: Install Python deps
        run: |
          pip install -r scripts/requirements-images.txt || true
          pip install playwright

      - name: Install Playwright WebKit
        run: python3 -m playwright install --with-deps webkit

      # Option-level stock first, so a long scrape hitting the runner limit
      # cannot leave sold-out sizes purchasable.
      - name: Refresh Dior per-size stock (Algolia)
        run: python3 scripts/patch-di-rtw-sizes-from-algolia.py

      - name: Commit per-size stock
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore(di): per-size stock refresh" src/data/di

      # Also leaves the product-images tag objects local, so each stage's image
      # push only fetches what other brands pushed since.
      - name: Restore di-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs di-pdp

      - name: Run Dior weekly sync
        id: sync
        env:
          PAUSE_SEC: "30"
          # No new category starts after this; the longest stage runs ~2h.
          DI_BUDGET_MIN: "180"
          DI_RESUME: ${{ inputs.resume == '1' && '1' || '0' }}
        run: |
          chmod +x scripts/run-di-weekly-sync.sh
          scripts/run-di-weekly-sync.sh

      - name: Commit catalog updates
        run: |
          scripts/ci-commit-push.sh "chore(di): weekly catalog sync" src/data/di \
            src/data/product-images-manifest.json

      - name: Continue remaining categories in a new run
        if: steps.sync.outputs.more == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const part = Math.max(1, parseInt(String((context.payload.inputs || {}).part || '1'), 10) || 1);
            if (part >= 6) {
              core.setFailed(`Dior sync still unfinished after ${part} runs — check Actions logs`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-di-sync.yml',
              ref: 'main',
              inputs: { resume: '1', part: String(part + 1) },
            });
            core.info(`Dispatched Dior sync part ${part + 1}`);
