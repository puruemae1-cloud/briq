name: Weekly CW stock sync

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-cw-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync CW categories + stock
        run: python3 scripts/weekly-cw-stock-sync.py

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Christopher Ward stock + clearance sync" \
            src/data/cw
