name: Weekly CW stock sync

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-cw-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync CW categories + stock
        run: python3 scripts/weekly-cw-stock-sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "briq-bot"
          git config user.email "briq-bot@users.noreply.github.com"
          git add -A src/data/cw public/products/cw-pdp
          if git diff --staged --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: weekly Christopher Ward stock + clearance sync

          Auto-refresh CW PLP membership, prices, and inStock from christopherward.com.
          EOF
          )"
          git push
