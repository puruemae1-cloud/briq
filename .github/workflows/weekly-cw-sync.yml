name: Biweekly CW stock sync

on:
  schedule:
    # Friday 02:00 UTC (03:00 UK / BST) — after banner refresh
    # Odd ISO weeks only (gate job) — even weeks exit before any catalogue commit.
    - cron: "0 2 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-cw-stock-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Odd ISO week only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — syncing."
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — syncing."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — skip (biweekly). No catalogue push."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Restore cw-pdp + editorial images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs cw-pdp cw-editorial

      - name: Sync CW categories + stock
        run: python3 scripts/weekly-cw-stock-sync.py
        # Includes watch-straps PLP → cw-straps (SRP×2100) via sync-cw-straps.py

      - name: Push PDP + editorial images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs cw-pdp cw-editorial

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand cw --remote --skip-local --all-images


      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand cw
      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Christopher Ward stock + clearance + straps sync" \
            src/data/cw \
            src/data/homepage-rail-picks.json \
            src/data/product-images-manifest.json \
            scripts/weekly-cw-stock-sync.py \
            scripts/sync-cw-straps.py \
            scripts/refresh-homepage-rail-picks.py \
            scripts/enrich-cw-missing-editorial-and-copy.py \
            scripts/rescrape-cw-editorial-full.py \
            scripts/rebuild-cw-catalog.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
