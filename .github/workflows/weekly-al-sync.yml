name: Biweekly AllSaints sync

on:
  schedule:
    # Friday 14:00 UTC (15:00 UK / BST) — after Dior
    # Odd ISO weeks only (gate job) — even weeks exit before any catalogue commit.
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-al-stock-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Odd ISO week only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — syncing."
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — syncing."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week — skip (biweekly). No catalogue push."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install curl_cffi
          pip install -r scripts/requirements-images.txt || true

      - name: Restore al-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs al-pdp

      - name: Run AL weekly sync
        run: |
          chmod +x scripts/run-al-weekly-sync.sh
          scripts/run-al-weekly-sync.sh

      # Selective CDN catch-up in small waves — full missing-list force-push hangs /
      # disconnects on this giant tag. Chunked push is the reliable path.
      - name: Push PDP images to product-images tag
        run: |
          chmod +x scripts/ci-publish-pdp-cdn.sh
          scripts/ci-publish-pdp-cdn.sh al-pdp --brand al --chunk 12 --max-waves 80


      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand al
      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly AllSaints catalog sync" \
            src/data/al \
            scripts/run-al-weekly-sync.sh \
            scripts/build-al-catalog.py \
            scripts/scrape-al-family.py \
            scripts/retag-al-leaves.py \
            scripts/retranslate-al-ko.py \
            scripts/check-al-korean.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
