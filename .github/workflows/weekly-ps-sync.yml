name: Weekly Paul Smith stock sync

on:
  schedule:
    # Every Friday 08:00 UTC (09:00 UK / BST) — after Belstaff
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ps-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Restore ps-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs ps-pdp

      - name: Sync Paul Smith catalogue (stock + new + remove)
        run: python3 scripts/weekly-ps-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs ps-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand ps --remote --skip-local --all-images

      - name: Commit and push catalogue
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Paul Smith stock + catalogue sync" \
            src/data/ps \
            scripts/weekly-ps-stock-sync.py \
            scripts/scrape-ps-mens.py \
            scripts/scrape-ps-extend.py \
            scripts/build-ps-catalog.py \
            scripts/catalog_image_guard.py \
            scripts/verify-product-images.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/ci-commit-push.sh
