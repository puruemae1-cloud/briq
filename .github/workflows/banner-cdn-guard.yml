name: Banner CDN guard

on:
  push:
    branches: [main]
    paths:
      - "public/banners/**"
      - "src/components/BannerImage.tsx"
      - "src/data/home-banners.ts"
      - "src/data/shop-heroes.ts"
      - "src/data/brand-heroes.ts"
      - "scripts/verify-banner-cdn.py"
      - "scripts/push-product-images-tag.py"

permissions:
  contents: write

concurrency:
  group: product-images-tag
  cancel-in-progress: false

jobs:
  sync-banners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push banners to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs banners --skip-whiten

      - name: Purge jsDelivr banner cache
        run: python3 scripts/purge-jsdelivr-media.py --dirs banners

      - name: Commit product-images manifest
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: sync banner CDN after main update" \
            src/data/product-images-manifest.json \
            src/data/banner-refresh-manifest.json
