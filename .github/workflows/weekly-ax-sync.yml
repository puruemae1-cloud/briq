name: Weekly Arc'teryx stock sync

on:
  schedule:
    # Every Friday 05:00 UTC (06:00 UK / BST) — after Burberry
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ax-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image whitening deps
        run: pip install -r scripts/requirements-images.txt

      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Restore ax PDP images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs ax-pdp axa-pdp axg-pdp

      - name: Sync Arc'teryx (apparel + footwear + gear)
        env:
          AX_REFRESH_STOCK: "1"
        run: python3 scripts/weekly-ax-stock-sync.py

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs ax-pdp axa-pdp axg-pdp

      - name: Verify catalogue images are on the product-images tag
        run: python3 scripts/verify-product-images.py --brand ax --brand axa --brand axg --remote --skip-local --all-images

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Arc'teryx catalogue sync" \
            src/data/ax \
            scripts/weekly-ax-stock-sync.py \
            scripts/enrich-ax-apparel-playwright.py \
            scripts/enrich-ax-gear-playwright.py \
            scripts/build-ax-apparel-catalog.py \
            scripts/build-ax-catalog.py \
            scripts/build-ax-gear-catalog.py \
            scripts/scrape-ax-outdoor-apparel.py \
            scripts/scrape-ax-footwear.py \
            scripts/scrape-ax-gear.py \
            scripts/ax_size_charts.py \
            scripts/ax_size_order.py \
            scripts/studio_whiten.py \
            scripts/whiten-product-studio-bg.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh
