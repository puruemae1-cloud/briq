name: Weekly Arc'teryx stock sync

on:
  schedule:
    # Every Monday 11:00 UTC (~20:00 KST) — after Burberry
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ax-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Sync Arc'teryx (apparel + footwear + gear)
        env:
          AX_REFRESH_STOCK: "1"
        run: python3 scripts/weekly-ax-stock-sync.py

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Arc'teryx catalogue sync" \
            src/data/ax \
            scripts/weekly-ax-stock-sync.py \
            scripts/enrich-ax-apparel-playwright.py \
            scripts/enrich-ax-gear-playwright.py \
            scripts/build-ax-apparel-catalog.py \
            scripts/build-ax-catalog.py \
            scripts/build-ax-gear-catalog.py \
            scripts/scrape-ax-outdoor-apparel.py \
            scripts/scrape-ax-footwear.py \
            scripts/scrape-ax-gear.py \
            scripts/ax_size_charts.py \
            scripts/ax_size_order.py
