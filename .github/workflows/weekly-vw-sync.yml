name: Weekly Vivienne Westwood sync

on:
  schedule:
    - cron: "30 13 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VW weekly sync
        run: |
          chmod +x scripts/run-vw-weekly-sync.sh
          scripts/run-vw-weekly-sync.sh

      - name: Apply Briq NEW badge TTL (7 days)
        run: python3 scripts/apply-new-badge-ttl.py --brand vw
      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/vw || true
          if git diff --staged --quiet; then
            echo "No VW catalog changes"
          else
            git commit -m "chore(vw): weekly catalog sync"
            git push
          fi
