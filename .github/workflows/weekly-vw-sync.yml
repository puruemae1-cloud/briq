name: Weekly Vivienne Westwood sync

on:
  schedule:
    - cron: "30 13 * * 5"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run VW weekly sync scaffold
        run: |
          chmod +x scripts/run-vw-weekly-sync.sh
          scripts/run-vw-weekly-sync.sh
