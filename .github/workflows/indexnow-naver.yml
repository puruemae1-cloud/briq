name: Naver IndexNow

# After each production deploy, tell Naver about pages registered in the last
# two days. The key file is served from the site root. A full backfill of the
# old catalogue is intentionally not sent.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-naver
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Submit recent URLs to Naver
        run: node scripts/indexnow-naver.mjs
