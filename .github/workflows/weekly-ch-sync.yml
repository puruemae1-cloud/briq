name: Weekly CH stock sync

on:
  schedule:
    # Every Friday 11:00 UTC (12:00 UK / BST) — Chanel last (longest)
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Retry attempt (auto-filled on requeue; leave as 1 for manual runs)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-ch-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap at 6h regardless of a higher value.
    # Stay under that and rely on resumable phases + requeue.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scrape + image deps
        run: |
          pip install "curl_cffi>=0.7.0" beautifulsoup4
          pip install -r scripts/requirements-images.txt || true

      - name: Restore ch-pdp images from product-images tag
        run: python3 scripts/restore-product-images-tag.py --dirs ch-pdp

      - name: Phase scrape (PLP discovery; skips complete PDPs)
        run: python3 scripts/weekly-ch-stock-sync.py --phase scrape

      - name: Checkpoint scrape progress
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Chanel scrape checkpoint" \
            src/data/ch \
            src/data/categories.ts

      - name: Phase enrich (Korean beauty PDP copy, --resume)
        run: python3 scripts/weekly-ch-stock-sync.py --phase enrich

      - name: Checkpoint enrich progress
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Chanel beauty-copy checkpoint" \
            src/data/ch

      - name: Phase stock + catalogue rebuild
        run: python3 scripts/weekly-ch-stock-sync.py --phase stock-build

      # Re-fetch any catalogue paths still missing on disk (raw CDN → ch-pdp)
      # before publishing the tag. Stops broken jsDelivr cards when CI built
      # against stale localImages that were never on product-images.
      - name: Repair missing Chanel PDP images
        run: python3 scripts/repair-missing-catalog-images.py --brand ch

      - name: Push PDP images to product-images tag
        run: python3 scripts/push-product-images-tag.py --dirs ch-pdp --skip-whiten

      # Hard fail — never swallow missing remote images (`|| true` hid 26 beauty 404s).
      - name: Verify product images (remote)
        run: python3 scripts/verify-product-images.py --brand ch --remote --skip-local --all-images

      - name: Commit and push if changed
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh \
            "chore: weekly Chanel stock + catalogue sync" \
            src/data/ch \
            src/data/categories.ts \
            scripts/weekly-ch-stock-sync.py \
            scripts/enrich-ch-beauty-copy.py \
            scripts/sync-ch-gb-stock.py \
            scripts/build-ch-catalog.py \
            scripts/ch_hybris_details.py \
            scripts/scrape-ch-makeup.py \
            scripts/scrape-ch-skincare.py \
            scripts/scrape-ch-fragrance.py \
            scripts/scrape-ch-handbags.py \
            scripts/scrape-ch-rtw.py \
            scripts/scrape-ch-shoes.py \
            scripts/scrape-ch-slg.py \
            scripts/scrape-ch-jewellery.py \
            scripts/scrape-ch-fine-jewellery.py \
            scripts/scrape-ch-high-jewellery.py \
            scripts/scrape-ch-sunglasses.py \
            scripts/scrape-ch-other-acc.py \
            scripts/scrape-ch-watches.py \
            scripts/push-product-images-tag.py \
            scripts/restore-product-images-tag.py \
            scripts/verify-product-images.py \
            scripts/ci-commit-push.sh

  # Only requeue on runner hard-cancel (~6h cap). Do NOT requeue on failure —
  # Akamai 403 loops were burning Actions minutes and triggering repeat deploys.
  requeue:
    needs: sync
    if: always() && needs.sync.result == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-dispatch after runner timeout only
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 3;
            const raw =
              (context.payload.inputs && context.payload.inputs.attempt) ||
              '1';
            const attempt = Math.max(1, parseInt(String(raw), 10) || 1);
            core.info(`Chanel weekly sync cancelled on attempt ${attempt}`);
            if (attempt >= maxAttempts) {
              core.setFailed(
                `Chanel weekly sync still not finished after ${maxAttempts} timeout retries — check Actions logs`
              );
              return;
            }
            const next = String(attempt + 1);
            core.info(`Re-dispatching weekly-ch-sync.yml attempt=${next} (timeout resume only)`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'weekly-ch-sync.yml',
              ref: context.ref.replace(/^refs\/heads\//, '') || 'main',
              inputs: { attempt: next },
            });
